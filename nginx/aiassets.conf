# /etc/nginx/sites-available/aiassets
# Reverse proxy to the Next.js app (PM2, port 3000), with gzip + basic
# static asset caching to keep response times low on modest hardware.

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Redirect to HTTPS once certbot has issued a certificate:
    # return 301 https://$host$request_uri;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    client_max_body_size 5m;
}

# After DNS points at this server, run:
#   sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com
# to enable HTTPS and auto-configure the redirect above.
